<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="SmartSpend - a modern 2026 expense tracker built with vanilla js." />
        <title>SmartSpend -Track your many</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>

        <header class="topbar">
            <div class="brand"><span class="dot"></span> SmartSpend</div>
            <button id="themeBtn" class="ghost"> Dark</button>
        </header>

        <main class="wrap">

            <section class="cards">
                <article class="card">
                    <p class="label">Income</p>
                    <h2 id="totalIncome" class="up">৳0</h2>
                </article>
                <article class="card">
                    <p class="label">Expense</p>
                     <h2 id="totalExpense" class="down">৳0</h2>
                </article>
                <article class="card highlight">
                    <p class="label">Balance</p>
                     <h2 id="balance">৳0</h2>
                </article>
            </section>
        </main>
    </body>
</html>
